name: collector heartbeat
# baseline pinger so WIPEOUT keeps recording liquidation history even when
# nobody has the site open; open browser tabs also ping every minute
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ping collector three times across the window
        run: |
          for i in 1 2 3; do
            curl -sf --max-time 90 "https://wipeout-kappa.vercel.app/api/collect" || true
            echo
            [ $i -lt 3 ] && sleep 65
          done
